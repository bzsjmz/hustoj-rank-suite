name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backend tests
        run: python -B scripts/run_tests.py
      - run: python -m unittest discover -s tests -v
        working-directory: plugins/astrbot_plugin_oj_rank
      - run: python -B scripts/check_public_release.py --history
